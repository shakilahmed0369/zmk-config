# ── Bluetooth ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ── BLE connection intervals ───────────────────────────────────────────────────
# ZMK v0.3.0 defaults (value * 1.25ms). A keystroke waits for the next connection
# event, so this IS typing latency: 6/8 = 7.5-10ms, ~4.4ms average. 6 is the BLE
# floor; 8 caps param-honoring hosts (Windows/Linux) at 10ms. macOS ignores these
# prefs and keeps its own ~15ms schedule, so this is a no-op there.
# Do not "stabilize" these back to 16/20 - that is ~11ms average input lag.
# The 7.5-12.5ms experiment was never actually tested: those builds used
# misspelled symbols (BT_PERIPHERAL_PREF_MIN, missing the _INT), so the only
# thing that ever caused right-half dropouts was CONFIG_ZMK_SLEEP=y.
# Experiment: reverting MAX to 12 (15ms cap) is always safe if a host acts up.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ── Windows BT fixes (from ZMK docs) ──────────────────────────────────────────
# Workaround for Windows battery notification bug that causes instant disconnect
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# Boost TX power for stronger connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split peripheral optimization ──────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
# Half-to-half link. 6 = 7.5ms, ZMK's default; right-half keys pay this hop
# before the central can forward them, so the old 16 (20ms) added ~10ms to
# every right-half keystroke on top of the host link.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
# Supervision timeout only decides how long the central waits before declaring
# the peripheral dead - it costs nothing in latency, so keep it long.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# ── Power saving ───────────────────────────────────────────────────────────────
# Disabled: peripheral (right) sleeping was causing random split dropouts that
# required a power-cycle to recover. If you want battery saving later, re-enable
# ZMK_SLEEP but keep the split interval/timeout settings above.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ── Encoder (uncomment to enable) ─────────────────────────────────────────────
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── OLED display (zmk-nice-oled) ──────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Below the BLE notify thread (priority 5) so a display flush over I2C cannot push
# a HID notification past a connection event. Only costs slightly lazier UI.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=8
# Blank both panels after CONFIG_ZMK_IDLE_TIMEOUT (60s): kills the idle drain and
# the burn-in risk of a still image. Wakes instantly on the first keystroke.
# (nice-oled defaults this off for OLED screens.)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_NICE_OLED_WIDGET_INVERTED=y

# Central (left): Layer, BT, battery + static extras.
# No animated widgets: every animation frame redraws the whole 128x32 panel over
# I2C, and the WPM/HID Luna animations ran once a second. Static WPM number +
# static HID indicator images instead.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Layer & profile positions
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=146
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=137

# Peripheral (right): Minimal animation to reduce power draw
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=2500
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n

# ── NRF52840 NFC pins → GPIO (required for P0.09 / Row 4 / thumb cluster) ─────
CONFIG_NFCT_PINS_AS_GPIOS=y