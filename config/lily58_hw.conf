# ── Bluetooth ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE=y
CONFIG_ZMK_POINTING=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ── BLE connection intervals ───────────────────────────────────────────────────
# Rolled back from aggressive 7.5-12.5ms (caused RF instability/dropouts).
# Standard ZMK defaults (interval * 1.25ms): 16→20ms is stable for splits.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=16
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ── Windows BT fixes (from ZMK docs) ──────────────────────────────────────────
# Workaround for Windows battery notification bug that causes instant disconnect
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# Boost TX power for stronger connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split peripheral optimization ──────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
# Tune the split BLE link itself (these ARE valid ZMK symbols).
# Longer supervision timeout = central waits longer before declaring the
# peripheral dead, preventing spurious "disconnects" from transient RF drops.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600
# Standard, stable connection interval for the half-to-half link.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=16

# ── Power saving ───────────────────────────────────────────────────────────────
# Disabled: peripheral (right) sleeping was causing random split dropouts that
# required a power-cycle to recover. If you want battery saving later, re-enable
# ZMK_SLEEP but keep the split keep-alive settings below.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ── Encoder (uncomment to enable) ─────────────────────────────────────────────
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── OLED display (zmk-nice-oled) ──────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5
CONFIG_NICE_OLED_WIDGET_INVERTED=y

# Central (left): Layer, BT, battery + lightweight extras
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=1000
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ONLY_CAPSLOCK=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ANIMATION_MS=1000
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Layer & profile positions
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=146
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=137

# Peripheral (right): Minimal animation to reduce power draw
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=2500
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n

# ── NRF52840 NFC pins → GPIO (required for P0.09 / Row 4 / thumb cluster) ─────
CONFIG_NFCT_PINS_AS_GPIOS=y